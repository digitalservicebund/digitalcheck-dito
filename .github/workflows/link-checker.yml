name: Link Checker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1" # every Monday at 10 am

jobs:
  link-checker:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Link Checker
        uses: digitalservicebund/link-checker-gha@bc12697a11e84fda6730e3ebea632ed72209ac67 # v2.1.2
        with:
          SITEMAP_URL: "https://digitalcheck.bund.de/sitemap-0.xml"
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          # exclude page-internal redirects, these are expected
          CHECK_ARGS: >-
            --exclude .js|/api/
            --exclude /grundlagen$
            --exclude /interoperabel/loesungen$
